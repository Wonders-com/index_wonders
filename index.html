<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wondes AI 聊天機器人</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .qa-block {
      background-color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .timestamp {
      font-size: 0.85em;
      color: #888;
      text-align: right;
    }
    .question {
      font-weight: bold;
      color: #1565c0;
      margin-top: 5px;
    }
    .answer {
      margin-top: 8px;
      white-space: pre-wrap;
      color: #2e7d32;
    }
    .btn-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>Wondes AI 問答平台</h1>
  <label for="question">請輸入問題：</label><br/>
  <textarea id="question" placeholder="例如：益生菌有什麼功效？"></textarea><br/>
  <div class="btn-group">
    <button onclick="askQuestion()">送出</button>
    <button onclick="exportCSV()">匯出 CSV</button>
    <button onclick="exportTXT()">匯出 TXT</button>
  </div>

  <div id="chatHistory"></div>

  <script>
    const apiURL = "https://wonders-ai.resource-a2e.workers.dev/";
    const chatHistoryDiv = document.getElementById("chatHistory");

    function getTaiwanTime() {
      const now = new Date();
      return new Date(now.getTime() + (8 * 60 * 60 * 1000)).toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei',
        hour12: false
      });
    }

    function appendQA(question, answer, time) {
      const block = document.createElement("div");
      block.className = "qa-block";

      const timestamp = document.createElement("div");
      timestamp.className = "timestamp";
      timestamp.textContent = "🕒 " + (time || getTaiwanTime());

      const q = document.createElement("div");
      q.className = "question";
      q.textContent = "👤 你：" + question;

      const a = document.createElement("div");
      a.className = "answer";
      a.textContent = "🤖 AI：" + answer;

      block.appendChild(timestamp);
      block.appendChild(q);
      block.appendChild(a);
      chatHistoryDiv.appendChild(block);
    }

    function saveToLocal(question, answer) {
      const time = getTaiwanTime();
      let history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      history.push({ q: question, a: answer, time });
      localStorage.setItem("chatHistory", JSON.stringify(history));
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      history.forEach(item => {
        appendQA(item.q, item.a, item.time);
      });
    }

    async function askQuestion() {
      const textarea = document.getElementById("question");
      const question = textarea.value.trim();
      if (!question) return;

      appendQA(question, "⌛ 請稍候...");
      textarea.value = "";

      try {
        const response = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        const answer = data.answer || "⚠️ 無回應，請稍後再試。";

        // 移除 loading
        chatHistoryDiv.lastChild.remove();
        appendQA(question, answer);
        saveToLocal(question, answer);
      } catch (error) {
        chatHistoryDiv.lastChild.remove();
        appendQA(question, "❌ 發生錯誤：" + error.message);
      }
    }

    function exportCSV() {
      const history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      if (!history.length) return alert("尚無問答紀錄");

      const rows = [["時間", "問題", "回答"]];
      history.forEach(item => {
        rows.push([item.time, item.q, item.a]);
      });

      const csvContent = rows.map(e => e.map(x => `"${x.replace(/"/g, '""')}"`).join(",")).join("\n");
      downloadFile(csvContent, "wondes_chat_history.csv", "text/csv");
    }

    function exportTXT() {
      const history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      if (!history.length) return alert("尚無問答紀錄");

      let txt = "";
      history.forEach(item => {
        txt += `🕒 ${item.time}\n👤 問題：${item.q}\n🤖 回答：${item.a}\n\n`;
      });

      downloadFile(txt, "wondes_chat_history.txt", "text/plain");
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    window.onload = loadHistory;
  </script>
</body>
</html>
