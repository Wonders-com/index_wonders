<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wondes AI 聊天機器人</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .qa-block {
      background-color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .question {
      font-weight: bold;
      color: #1565c0;
    }
    .answer {
      margin-top: 8px;
      white-space: pre-wrap;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>Wondes AI 問答平台</h1>
  <label for="question">請輸入問題：</label><br/>
  <textarea id="question" placeholder="例如：益生菌有什麼功效？"></textarea><br/>
  <button onclick="askQuestion()">送出</button>

  <div id="chatHistory"></div>

  <script>
    const apiURL = "https://wonders-ai.resource-a2e.workers.dev/";
    const chatHistoryDiv = document.getElementById("chatHistory");

    function appendQA(question, answer) {
      const block = document.createElement("div");
      block.className = "qa-block";

      const q = document.createElement("div");
      q.className = "question";
      q.textContent = "👤 你：" + question;

      const a = document.createElement("div");
      a.className = "answer";
      a.textContent = "🤖 AI：" + answer;

      block.appendChild(q);
      block.appendChild(a);
      chatHistoryDiv.appendChild(block);
    }

    function saveToLocal(question, answer) {
      let history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      history.push({ q: question, a: answer, time: new Date().toISOString() });
      localStorage.setItem("chatHistory", JSON.stringify(history));
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("chatHistory")) || [];
      history.forEach(item => {
        appendQA(item.q, item.a);
      });
    }

    async function askQuestion() {
      const textarea = document.getElementById("question");
      const question = textarea.value.trim();
      if (!question) return;

      appendQA(question, "⌛ 請稍候...");
      textarea.value = "";

      try {
        const response = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        const answer = data.answer || "⚠️ 無回應，請稍後再試。";

        // 移除上一個 loading 區塊，重新加入實際回答
        chatHistoryDiv.lastChild.remove();
        appendQA(question, answer);
        saveToLocal(question, answer);
      } catch (error) {
        chatHistoryDiv.lastChild.remove();
        appendQA(question, "❌ 發生錯誤：" + error.message);
      }
    }

    window.onload = loadHistory;
  </script>
</body>
</html>
