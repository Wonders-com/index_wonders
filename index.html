<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wonders AI 問答平台</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .qa-container {
      margin-top: 30px;
    }
    .question, .answer {
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .question {
      background-color: #e3f2fd;
    }
    .answer {
      background-color: #f1f8e9;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .history-title {
      margin-top: 40px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Wondes AI 問答平台</h1>
  <label for="question">請輸入問題：</label><br/>
  <textarea id="question" placeholder="例如：益生菌有什麼功效？"></textarea><br/>
  <button onclick="askQuestion()">送出</button>

  <div id="qa-list" class="qa-container"></div>

  <h2 class="history-title">📜 對話歷史紀錄</h2>
  <div id="history" class="qa-container"></div>

  <script>
    let historyLog = [];

    async function askQuestion() {
      const questionText = document.getElementById("question").value.trim();
      if (!questionText) return;

      const qaList = document.getElementById("qa-list");
      const historyDiv = document.getElementById("history");
      qaList.innerHTML = ""; // 清除目前畫面

      const questionDiv = document.createElement("div");
      questionDiv.className = "question";
      questionDiv.textContent = "👤 使用者提問：" + questionText;
      qaList.appendChild(questionDiv);

      const answerDiv = document.createElement("div");
      answerDiv.className = "answer";
      answerDiv.textContent = "⌛ 請稍候...";
      qaList.appendChild(answerDiv);

      try {
        const response = await fetch("https://wonders-ai.resource-a2e.workers.dev/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: questionText })
        });

        const data = await response.json();
        const answerText = data.answer || "⚠️ 無回應，請稍後再試。";
        answerDiv.textContent = "🤖 Gemini 回答：" + answerText;

        historyLog.push({ q: questionText, a: answerText });
        updateHistory();

      } catch (error) {
        answerDiv.textContent = "❌ 發生錯誤：" + error.message;
      }

      document.getElementById("question").value = "";
    }

    function updateHistory() {
      const historyDiv = document.getElementById("history");
      historyDiv.innerHTML = "";

      historyLog.slice().reverse().forEach(entry => {
        const q = document.createElement("div");
        q.className = "question";
        q.textContent = "👤 " + entry.q;

        const a = document.createElement("div");
        a.className = "answer";
        a.textContent = "🤖 " + entry.a;

        historyDiv.appendChild(q);
        historyDiv.appendChild(a);
      });
    }
  </script>
</body>
</html>
